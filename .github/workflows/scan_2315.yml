name: Scan 2 — 23:15 RO
on:
  schedule:
    - cron: '15 20 * * 1-5' # 20:15 UTC = 23:15 ora României (Ora de Vară)
  workflow_dispatch: # Buton de test manual în GitHub Actions

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalare dependinte
        run: pip install yfinance pandas numpy pyTelegramBotAPI pytz
      - name: Rulare Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trading_bot.py
