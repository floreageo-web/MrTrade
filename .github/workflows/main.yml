name: Rulare Strategie MrTrade

on:
  workflow_dispatch: # Îl lăsăm doar pe manual pentru test

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare librarii
        run: |
          pip install yfinance pandas requests pytz numpy pyTelegramBotAPI

      # SCANNERUL ESTE OPRIT - NU VA STERGE LISTA TA DE 317
      # - name: Ruleaza Scanner
      #   run: python scanner.py

      - name: Ruleaza Analiza Breakout
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analiza_tehnica.py

      - name: Ruleaza Analiza Retest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analiza_retest.py

      - name: Salveaza rezultatele
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add baza_de_date.json
          git commit -m "Analiza pe lista fixa de 317" || exit 0
          git push
