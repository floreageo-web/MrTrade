name: Rulare Strategie MrTrade

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Am urcat la 3.10 pentru compatibilitate mai bună

      - name: Instalare librării
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pyTelegramBotAPI pandas
          pip install pandas-ta # Am corectat aici denumirea

      - name: Rulează Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Salvează baza de date actualizată
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add baza_de_date.json
          git commit -m "Update lists" || exit 0
          git push
