name: Rulare Strategie Trading Premium

on:
  schedule:
    # Orele sunt setate in UTC (Ora Romaniei minus 2 ore)
    # 23:15 (pentru testul de acum), 08:00 (10:00 RO), 16:00 (18:00 RO), 20:00 (22:00 RO)
    - cron: '15 23,8,16,20 * * *'
  workflow_dispatch: # Permite butonul de "Run workflow"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare librarii
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pyTelegramBotAPI numpy pytz

      - name: Rulare Strategie Completa
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py
          python analiza_tehnica.py
          python confirmare_retest.py

      - name: Salveaza modificarile in baza de date
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add baza_de_date.json
          git commit -m "Update automat: $(date)" || exit 0
          git push
