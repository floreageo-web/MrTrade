name: Rulare Strategie MrTrade

on:
  schedule:
    - cron: '20 10 * * *'  # Rulează automat la 12:20 ora României
  workflow_dispatch:        # Îți permite să apeși tu pe buton oricând

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare librarii
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Ruleaza Analiza Tehnica Trend
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analiza_tehnica.py

      - name: Salveaza rezultatele in baza de date
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add baza_de_date.json
          git commit -m "Update watchlist trend ascendent" || exit 0
          git push
