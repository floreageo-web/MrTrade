on:
  schedule:
    # RUNDA 1: Dimineața - Pregătirea Watchlist-ului de Trend (Pasul 1 & 2)
    - cron: '00 09 * * *'  # 11:00 ora României
    
    # RUNDA 2: Seara - Scanare Breakout în timpul pieței (Pasul 3)
    - cron: '00 17 * * *'  # 19:00 ora României
    
    # RUNDA 3: Noaptea - Scanare Finală după închidere (Pasul 3)
    - cron: '30 21 * * *'  # 23:30 ora României
  workflow_dispatch:
