name: Rulare Strategie MrTrade

on:
  schedule:
    - cron: '00 09 * * *'  # 11:00 RO
    - cron: '30 15 * * *'  # 17:30 RO
    - cron: '00 17 * * *'  # 19:00 RO
    - cron: '30 18 * * *'  # 20:30 RO
    - cron: '30 20 * * *'  # 22:30 RO
    - cron: '30 21 * * *'  # 23:30 RO
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare librarii
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Ruleaza Analiza Breakout
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analiza_tehnica.py

      - name: Ruleaza Analiza Retest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analiza_retest.py

      - name: Salveaza rezultatele
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add baza_de_date.json
          git commit -m "Update baze de date (Breakout + Retest)" || exit 0
          git push
