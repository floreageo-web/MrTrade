name: Scanare SMC la 30 minute

on:
  schedule:
    # Rulează la fiecare 30 de minute (minutul 0 și 30)
    # Între orele 08:00 și 21:00 UTC (10:00 - 23:00 ora României)
    - cron: '0,30 8-21 * * *'
  workflow_dispatch: # Buton manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare librarii
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pyTelegramBotAPI numpy pytz

      - name: Rulare Analiza SMC
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Rulăm DOAR analiza pe lista deja existentă în baza de date
          python analiza_tehnica.py

      - name: Salveaza modificarile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add baza_de_date.json
          git commit -m "Update semnale trimise: $(date)" || exit 0
          git push
