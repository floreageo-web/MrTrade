name: Rulare Strategie MrTrade

on:
  schedule:
    # 08:00 UTC este 10:00 ora Romaniei (iarna)
    - cron: '00 08 * * *'
  workflow_dispatch: # Iti permite sa il rulezi si manual oricand vrei

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare librarii
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests pytz numpy pyTelegramBotAPI

      - name: Ruleaza Scanner (Standby)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Ruleaza Analiza Tehnica (Raport Scurt)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analiza_tehnica.py

      - name: Salveaza rezultatele
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add baza_de_date.json
          git commit -m "Raport zilnic ora 10:00 - $(date)" || exit 0
          git push
