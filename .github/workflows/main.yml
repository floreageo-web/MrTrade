name: MrTrade Automation
on:
  workflow_dispatch: # Pornire manuală
  schedule:
    - cron: '0 * * * *' # Rulează automat în fiecare oră

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Copiază codul
        uses: actions/checkout@v3
      - name: Instalează Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Instalează librăriile necesare
        run: pip install pyTelegramBotAPI yfinance google-generativeai
      - name: Execută MrTrade
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
