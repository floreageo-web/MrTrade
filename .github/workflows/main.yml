name: Rulare Strategie Trading Premium

on:
  schedule:
    # Rulează la fiecare 15 minute (GitHub poate avea mici întârzieri, e normal)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite să apeși tu pe butonul "Run workflow" oricând

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare librarii necesare
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pyTelegramBotAPI numpy

      - name: 1. Ruleaza Scanner (Cautare Trend)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: 2. Ruleaza Analiza Breakout (Semnale Noi)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analiza_tehnica.py

      - name: 3. Ruleaza Confirmare Retest (Lista Ta Manuala)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python confirmare_retest.py

      - name: Salveaza modificarile in baza de date
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add baza_de_date.json
          git commit -m "Update automat: $(date)" || exit 0
          git push
