name: Rulare Strategie Trading Premium

on:
  schedule:
    # Rulează la 01:15 (pentru testul de acum), la 10:00 și la 18:00 (Ora României)
    # 23:15 UTC = 01:15 RO | 08:00 UTC = 10:00 RO | 16:00 UTC = 18:00 RO
    - cron: '15 23,8,16 * * *'
  workflow_dispatch: # Îți permite să-i dai tu RUN oricând din buton

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare librarii necesare
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pyTelegramBotAPI numpy

      - name: 1. Ruleaza Scanner
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: 2. Ruleaza Analiza Breakout
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analiza_tehnica.py

      - name: 3. Ruleaza Confirmare Retest Premium
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python confirmare_retest.py

      - name: Salveaza datele
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add baza_de_date.json
          git commit -m "Update automat: $(date)" || exit 0
          git push
