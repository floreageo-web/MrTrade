name: Rulare Strategie Claude
on:
  schedule:
    - cron: '30 15 * * 1-5' # Rulează la 18:30 ora României (când e piața deschisă)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Bot
        run: python main.py --mode scan # Rulează doar scanarea și trimite pe Telegram
