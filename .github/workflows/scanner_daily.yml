name: Scanner Daily (Pullback Setup)

on:
  schedule:
    # Rulează la ora 21:15 UTC (23:15 ora României)
    # De luni până vineri
    - cron: '15 21 * * 1-5'
  workflow_dispatch: # Îți permite să îl pornești manual oricând pentru test

permissions:
  contents: write # Permite botului să salveze semnalele în baza_de_date.json

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare librarii
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pyTelegramBotAPI

      - name: Rulare Bot 1 - Scanner Daily
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Rulează scriptul care caută pullback-uri pe graficul zilnic
          python bot1_scanner_daily.py
