name: Scan 1 — 20:45 RO
on:
  schedule:
    - cron: '45 17 * * 1-5' # 17:45 UTC este 20:45 ora României (ora de vară)
  workflow_dispatch: # Permite rularea manuală pentru test

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalare dependinte
        run: pip install yfinance pandas numpy pyTelegramBotAPI pytz
      - name: Rulare Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trading_bot.py
