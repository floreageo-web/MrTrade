name: Extrage Istoric 20 Zile
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Libs
        run: pip install yfinance pandas
      - name: Run Extraction
        run: python istoric_20zile.py
      - name: Salveaza Rezultatul
        uses: actions/upload-artifact@v4
        with:
          name: date-bursiere-20-zile
          path: date_extractie_20_zile.csv
