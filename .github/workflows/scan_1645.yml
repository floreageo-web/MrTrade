name: Scan 1 — 16:45 RO

on:
  schedule:
    # 16:45 ora României (UTC+2 iarna) = 14:45 UTC
    # Vara (UTC+3) trebuie schimbat în 13:45 UTC
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setare Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalare librarii
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pyTelegramBotAPI pytz

      - name: Rulare scanare 16:45
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python trading_bot.py
